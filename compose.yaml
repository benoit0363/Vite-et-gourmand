services:
  web:
    build: .
    container_name: vite_gourmand_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=vite_gourmand_db
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: vite_gourmand_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: vite_gourmand_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # - ./sql:/docker-entrypoint-initdb.d
      - ./xampp_backup.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: