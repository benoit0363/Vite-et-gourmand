<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation de mot de passe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Mot de passe oublié ?</h2>
        <p class="text-gray-600 mb-6 text-sm">Entrez votre adresse e-mail pour recevoir un lien de réinitialisation.</p>

        <form id="reset-form" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Adresse e-mail</label>
                <input type="email" id="email" name="email" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="nom@exemple.com">
            </div>

            <button type="submit" id="submit-btn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition transform active:scale-95">
                Envoyer le lien
            </button>
        </form>

        <div id="status-box" class="mt-4 hidden p-3 rounded-lg text-sm font-medium"></div>
    </div>

    <script src="formulaire_MP.js"></script>
</body>
</html
